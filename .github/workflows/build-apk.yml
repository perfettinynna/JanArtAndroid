
name: Gerar APK JanArt

on:
  push:
    paths:
      - 'JanArt-projeto-android.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair arquivos
        run: unzip -o JanArt-projeto-android.zip

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar aplicativo
        run: cd JanArtAndroid && gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: JanArt-APK
          path: JanArtAndroid/app/build/outputs/apk/debug/app-debug.apk
