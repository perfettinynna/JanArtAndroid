
name: Gerar APK JanArt

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar e extrair arquivos
        run: |
          ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Arquivo ZIP não encontrado."
            find . -maxdepth 4 -type f
            exit 1
          fi
          echo "Arquivo encontrado: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar aplicativo
        run: cd extracted/JanArtAndroid && gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: JanArt-APK
          path: extracted/JanArtAndroid/app/build/outputs/apk/debug/app-debug.apk
